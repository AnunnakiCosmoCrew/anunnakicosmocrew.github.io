<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="CosmoCrew — calm, capable software, crafted to last">
  <!--
    Social card for the cosmic dark identity (ADR 0007). Ground, accent and
    nebula hues mirror apps/web/src/styles/theme-cosmic.css (#0b0c11 ground,
    #6e72d6 accent, #b48cf0 nebula) — keep the two in sync by hand.

    og.png is rasterised from this file:
      rsvg-convert -w 1200 -h 630 og.svg -o og.png
  -->
  <defs>
    <radialGradient id="nebula-a" cx="20%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#6e72d6" stop-opacity="0.26" />
      <stop offset="70%" stop-color="#6e72d6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-b" cx="86%" cy="22%" r="52%">
      <stop offset="0%" stop-color="#b48cf0" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#b48cf0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-c" cx="58%" cy="100%" r="62%">
      <stop offset="0%" stop-color="#6e72d6" stop-opacity="0.14" />
      <stop offset="75%" stop-color="#6e72d6" stop-opacity="0" />
    </radialGradient>
    <!-- Halo behind the orbit mark: the mark reads as the light source. -->
    <radialGradient id="mark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8c90f0" stop-opacity="0.34" />
      <stop offset="60%" stop-color="#8c90f0" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#8c90f0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0c11" />
  <rect width="1200" height="630" fill="url(#nebula-a)" />
  <rect width="1200" height="630" fill="url(#nebula-b)" />
  <rect width="1200" height="630" fill="url(#nebula-c)" />

  <!-- Starfield: kept out of the wordmark band so the type stays clean. -->
  <g fill="#ececef">
    <circle cx="72" cy="86" r="1.6" opacity="0.75" />
    <circle cx="168" cy="182" r="1.1" opacity="0.5" />
    <circle cx="246" cy="58" r="2" opacity="0.85" />
    <circle cx="330" cy="146" r="1.2" opacity="0.55" />
    <circle cx="118" cy="268" r="1.4" opacity="0.6" />
    <circle cx="402" cy="74" r="1" opacity="0.45" />
    <circle cx="486" cy="164" r="1.5" opacity="0.7" />
    <circle cx="560" cy="52" r="1.1" opacity="0.5" />
    <circle cx="676" cy="120" r="1.8" opacity="0.8" />
    <circle cx="758" cy="46" r="1.2" opacity="0.55" />
    <circle cx="842" cy="152" r="1.4" opacity="0.65" />
    <circle cx="928" cy="78" r="1" opacity="0.45" />
    <circle cx="1012" cy="188" r="1.7" opacity="0.75" />
    <circle cx="1098" cy="96" r="1.2" opacity="0.55" />
    <circle cx="1146" cy="248" r="1.4" opacity="0.6" />
    <circle cx="52" cy="392" r="1.3" opacity="0.55" />
    <circle cx="164" cy="470" r="1.7" opacity="0.7" />
    <circle cx="88" cy="556" r="1.1" opacity="0.5" />
    <circle cx="238" cy="600" r="1.5" opacity="0.65" />
    <circle cx="356" cy="524" r="1" opacity="0.45" />
    <circle cx="452" cy="588" r="1.4" opacity="0.6" />
    <circle cx="604" cy="552" r="1.2" opacity="0.5" />
    <circle cx="726" cy="602" r="1.6" opacity="0.7" />
    <circle cx="856" cy="536" r="1.1" opacity="0.5" />
    <circle cx="964" cy="596" r="1.4" opacity="0.6" />
    <circle cx="1076" cy="512" r="1.2" opacity="0.55" />
    <circle cx="1158" cy="588" r="1.6" opacity="0.7" />
    <circle cx="1132" cy="418" r="1.1" opacity="0.5" />
    <circle cx="44" cy="176" r="1.2" opacity="0.5" />
    <circle cx="1042" cy="330" r="1" opacity="0.4" />
  </g>
  <g>
    <circle cx="298" cy="330" r="2.2" fill="#b48cf0" opacity="0.55" />
    <circle cx="904" cy="270" r="2" fill="#8c90f0" opacity="0.5" />
    <circle cx="140" cy="120" r="1.8" fill="#b48cf0" opacity="0.45" />
    <circle cx="1010" cy="452" r="1.9" fill="#8c90f0" opacity="0.45" />
  </g>

  <!-- Orbit mark -->
  <g>
    <circle cx="600" cy="246" r="130" fill="url(#mark-glow)" />
    <circle cx="600" cy="246" r="46" fill="none" stroke="#8c90f0" stroke-width="8" />
    <circle cx="632.6" cy="213.4" r="13.5" fill="#8c90f0" />
  </g>

  <text x="600" y="400" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-1" fill="#ececef">CosmoCrew</text>

  <text x="600" y="460" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#b6b8c2">Calm, capable software, crafted to last.</text>
</svg>
